<div style="width: 560px; height: 560px; box-sizing: border-box; background: #16161e; color: #c0caf5; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 1.5; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;">

      <span style="font-size: 12px;"><span style="color: #9ece6a;">+25 fome</span> <span style="color: #9ece6a;">+5 felicidade</span></span>
